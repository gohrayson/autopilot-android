plugins { id 'com.android.application' }

android {
    namespace 'app.autopilot.android'
    compileSdk 35
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'app.autopilot.android'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-preview' }
        release {
            minifyEnabled false
            if (System.getenv('AUTOPILOT_KEYSTORE_PATH')) {
                signingConfig signingConfigs.create('localRelease') {
                    storeFile file(System.getenv('AUTOPILOT_KEYSTORE_PATH'))
                    storePassword System.getenv('AUTOPILOT_KEYSTORE_PASSWORD')
                    keyAlias 'autopilot'
                    keyPassword System.getenv('AUTOPILOT_KEYSTORE_PASSWORD')
                }
            }
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['META-INF/versions/**', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt'] }
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('libs/libmihomo-android-v0.3.11.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'org.yaml:snakeyaml:2.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
