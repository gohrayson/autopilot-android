plugins { id 'com.android.application' }

android {
    namespace 'app.autopilot.android'
    compileSdk 35
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'app.autopilot.android'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.4.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-preview' }
        release {
            minifyEnabled false
            if (System.getenv('AUTOPILOT_KEYSTORE_PATH')) {
                signingConfig signingConfigs.create('localRelease') {
                    storeFile file(System.getenv('AUTOPILOT_KEYSTORE_PATH'))
                    storePassword System.getenv('AUTOPILOT_KEYSTORE_PASSWORD')
                    keyAlias 'autopilot'
                    keyPassword System.getenv('AUTOPILOT_KEYSTORE_PASSWORD')
                }
            }
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['META-INF/versions/**', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt'] }
    }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets { test.resources.srcDirs += 'src/main/assets' }
    lint { abortOnError true }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('libs/libmihomo-android-v0.3.11.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'org.yaml:snakeyaml:2.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Standalone Android check: release identity and bundled routing data must agree
// with the same runtime contract used by the desktop build.
def productAssets = file('src/main/assets')
tasks.register('verifyProductContract') {
    inputs.files(new File(productAssets, 'product-contract.json'), new File(productAssets, 'policy-scenarios.json'),
        new File(productAssets, 'geoip-manifest.json'), new File(productAssets, 'geoip.metadb'), new File(productAssets, 'geoip-LICENSE.txt'))
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def product = parser.parse(new File(productAssets, 'product-contract.json'))
        if (product.schemaVersion != 1 || product.productVersion != android.defaultConfig.versionName || product.androidVersionCode != android.defaultConfig.versionCode) {
            throw new GradleException('Product contract and Android version metadata differ')
        }
        def geo = parser.parse(new File(productAssets, 'geoip-manifest.json'))
        def database = new File(productAssets, 'geoip.metadb')
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(database.bytes).encodeHex().toString()
        if (geo.name != database.name || geo.size != database.length() || geo.sha256 != digest) throw new GradleException('Bundled GeoIP checksum differs')
        if (!new File(productAssets, geo.licenseFile).isFile()) throw new GradleException('Bundled GeoIP license missing')
        logger.lifecycle("ANDROID_PRODUCT_CONTRACT_PASS version=${product.productVersion} geoip=${digest}")
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyProductContract' }
